name: Installer les visuels One Piece

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '.github/workflows/fetch-one-piece-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger les visuels officiels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_luffy.png" -o assets/luffy.png
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_Zoro.png" -o assets/zoro.png
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_Nami.png" -o assets/nami.png
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_Usopp.png" -o assets/usopp.png
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_Sanji.png" -o assets/sanji.png
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_Chopper_2.png" -o assets/chopper.png
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_Nico.png" -o assets/robin.png
          curl -fL --retry 3 "https://p325k7wa.twic.pics/high/one-piece/one-piece-odyssey/00-page-setup/OPOD_character_gallery/OPOD_Franky_2.png" -o assets/franky.png

      - name: Vérifier les fichiers
        shell: bash
        run: |
          test -s assets/luffy.png
          test -s assets/zoro.png
          test -s assets/nami.png
          test -s assets/usopp.png
          test -s assets/sanji.png
          test -s assets/chopper.png
          test -s assets/robin.png
          test -s assets/franky.png
          ls -lh assets

      - name: Enregistrer les visuels dans le dépôt
        shell: bash
        run: |
          if git status --porcelain assets | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Ajout des visuels One Piece locaux"
            git push
          else
            echo "Aucun changement à enregistrer."
          fi
